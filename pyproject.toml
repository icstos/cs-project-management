[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-project-management"
version = "1.0.0"
description = "CS 项目管理桌面应用：本地 Git 项目的台账、提交与统计"
requires-python = ">=3.12"
# UI 只依赖本地的 cs-ui（`import ui`）：flet / flet-charts 由它带入，本工程不直接引用。
# cs-ui 目前是本地可编辑安装，所以这里给**直接引用**（file URL）——PyPI 上没有这个包，
# 写 `cs-ui>=0.2.0` 会让 `flet build` 在装依赖那一步解析失败。
dependencies = [
    "cs-ui @ file:///D:/CSTOS/projects/cs-ui",
    "sqlmodel>=0.0.39",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
cs-pm = "main:run"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["models*", "infra*", "service*", "viewmodel*", "view*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# 界面文案使用中文全角标点，不需要按 ASCII 规则提示
ignore = ["RUF001", "RUF002", "RUF003"]

